app.name=Naumen-BPMS-engine
app.version=0.0.1

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bpms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bpms_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bpms_password}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
logging.level.liquibase=INFO
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG
