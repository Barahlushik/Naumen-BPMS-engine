app.name=Naumen-BPMS-engine
app.version=0.0.1-test

spring.datasource.url=jdbc:postgresql://localhost:5432/bpms
spring.datasource.username=bpms_user
spring.datasource.password=bpms_password
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml


spring.sql.init.mode=never

logging.level.liquibase=INFO
logging.level.org.springframework.boot.autoconfigure.liquibase=INFO