app.name=Naumen-BPMS-engine
app.version=0.0.1-test

spring.datasource.url=${TEST_SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bpms}
spring.datasource.username=${TEST_SPRING_DATASOURCE_USERNAME:bpms_user}
spring.datasource.password=${TEST_SPRING_DATASOURCE_PASSWORD:bpms_password}
spring.datasource.driver-class-name=${TEST_SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml


spring.sql.init.mode=never

logging.level.liquibase=INFO
logging.level.org.springframework.boot.autoconfigure.liquibase=INFO
logging.level.ru.naumen.bpms=INFO
